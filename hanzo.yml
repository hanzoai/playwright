# Canonical CI for hanzoai/playwright — a vendored upstream fork.
#
# No `images:` and no `deploy:`: we do not ship this, we carry it. What CI owes
# a fork is proof that the checkout still builds, so a bad merge from upstream —
# or a dependency that moved under us — goes red here instead of in whatever
# consumes it. The build compiles every package, so a type or source break fails it.
test:
  - name: build
    run: |
      set -e
      npm ci
      npm run build
